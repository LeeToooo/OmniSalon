<!DOCTYPE html>
<html lang="vi" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Omni Apothecary — Mỹ Phẩm & Dược Liệu Tóc Quốc Tế</title>
  <meta name="description" content="Cửa hàng mỹ phẩm tóc chính hãng: Brosh Nhật Bản, Suavecito USA, Reuzel Hà Lan, Olaplex tại Omni Salon.">
  <meta name="theme-color" content="#f1f3f6">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='22' fill='%23b48312'/><text x='50%' y='58%' dominant-baseline='middle' text-anchor='middle' fill='%23ffffff' font-family='sans-serif' font-weight='900' font-size='32'>OS</text></svg>">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&family=Plus+Jakarta+Sans:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../styles.css?v=20.0">
  <script src="../js/core/theme.js?v=1.0"></script>
</head>
<body data-theme="light">
  <div id="webPlatformSection" style="min-height: 100vh;">
    <div id="webHeaderContainer"></div>
    <main id="webMainContainer" style="min-height: calc(100vh - 120px);"></main>
  </div>
  <div class="modal-overlay" id="globalModal">
    <div class="modal-content-shell">
      <button class="modal-close-icon-btn" onclick="UICommon.closeGlobalModal()" title="Đóng">✕</button>
      <div id="globalModalBody"></div>
    </div>
  </div>
  <div class="cart-drawer-shell" id="cartDrawer">
    <div class="cart-drawer-header">
      <h3 style="font-size: 16px; font-weight: 800; text-transform: uppercase;">Giỏ Hàng Của Bạn</h3>
      <button class="modal-close-icon-btn" onclick="UICommon.closeCartDrawer()" title="Đóng">✕</button>
    </div>
    <div class="cart-drawer-list" id="cartItemsList"></div>
    <div class="cart-drawer-footer">
      <div style="display: flex; justify-content: space-between; align-items: baseline; margin-bottom: 12px;">
        <span style="font-size: 13px; font-weight: 600; color: var(--text-secondary);">Tổng thanh toán:</span>
        <span id="cartTotalAmount" style="font-size: 18px; font-weight: 900; color: var(--color-terracotta);">0 đ</span>
      </div>
      <button class="btn-submit-terracotta" style="width: 100%;" onclick="UICommon.checkoutCart()">Thanh Toán Đơn Hàng →</button>
    </div>
  </div>
  <div class="toast-container" id="toastContainer"></div>

  <script src="../js/core/utils.js?v=12.0"></script>
  <script src="../js/core/pricing.js?v=12.0"></script>
  <script src="../js/core/auth.js?v=12.0"></script>
  <script src="../js/core/store.js?v=12.0"></script>
  <script src="../js/core/api.js?v=12.0"></script>
  <script src="../js/widgets/widgets-bundle.js?v=12.0"></script>
  <script src="../js/components/ui-common.js?v=12.0"></script>
  <script src="../js/modules/customer/web/customer-web.js?v=12.0"></script>
  <script src="../js/modules/admin/web/admin-web.js?v=12.0"></script>
  <script src="../pages/home-page.js?v=12.0"></script>
  <script src="../pages/services-page.js?v=12.0"></script>
  <script src="../pages/stylists-page.js?v=12.0"></script>
  <script src="../pages/booking-page.js?v=12.0"></script>
  <script src="../pages/shop-page.js?v=12.0"></script>
  <script src="../pages/branches-page.js?v=12.0"></script>
  <script src="../pages/ai-studio-page.js?v=12.0"></script>
  <script src="../pages/admin-portal.js?v=12.0"></script>
  <script src="../js/core/router.js?v=12.0"></script>
  <script>
    if (window.CustomerWeb && typeof window.CustomerWeb.renderHeader === 'function') {
      window.CustomerWeb.renderHeader();
      window.CustomerWeb.initGlobalListeners();
      window.CustomerWeb.initAuthSync();
    }
    if (window.AppRouter) {
      window.AppRouter.init();
      window.AppRouter.navigate('/shop', false);
    }
  </script>
</body>
</html>
