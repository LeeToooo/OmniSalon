<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <title>OmniSalon Redirecting...</title>
  <script>
    (function () {
      // Tự động chuyển hướng GitHub Pages SPA subpath về dạng Hash Router
      var path = window.location.pathname || '';
      var search = window.location.search || '';
      var hash = window.location.hash || '';

      var repoPrefix = '/OmniSalon';
      var route = path;
      if (route.toLowerCase().startsWith(repoPrefix.toLowerCase())) {
        route = route.slice(repoPrefix.length);
      }
      route = route.replace(/^\/+/, '');
      if (route === '' || route === 'index.html') {
        window.location.replace(repoPrefix + '/' + (search || '') + (hash || ''));
      } else {
        window.location.replace(repoPrefix + '/#/' + route + (search || '') + (hash ? '&' + hash.replace(/^#/, '') : ''));
      }
    })();
  </script>
</head>
<body style="font-family: sans-serif; text-align: center; padding-top: 50px; background: #141413; color: #FAF8F5;">
  <h2>Đang chuyển hướng về OmniSalon...</h2>
  <p><a href="/OmniSalon/" style="color: #C59B27;">Bấm vào đây nếu không tự động chuyển hướng</a></p>
</body>
</html>
