  <!-- Khởi tạo giao diện và xử lý tham số url -->
  <script>
    const _searchParams = new URLSearchParams(window.location.search);
    if (_searchParams.get('theme') && typeof ThemeEngine !== 'undefined') {
      ThemeEngine.setTheme(_searchParams.get('theme'));
    }
    if (_searchParams.get('loginAs') && typeof AuthEngine !== 'undefined') {
      const roleOrUser = _searchParams.get('loginAs');
      const seed = AuthEngine.getSeedAccounts().find(u => u.username === roleOrUser || u.role === roleOrUser);
      if (seed) {
        AuthEngine.login(seed.username, seed.password);
        if (['SUPER_ADMIN', 'ADMIN', 'BRANCH_MANAGER'].includes(seed.role) || seed.username === 'admin') {
          if (typeof CustomerWeb !== 'undefined') {
            CustomerWeb.currentTab = 'admin';
          }
          setTimeout(() => {
            if (typeof AppRouter !== 'undefined' && !_searchParams.get('route')) {
              AppRouter.navigate('/admin');
            }
          }, 60);
        }
      }
    }

    if (typeof CustomerWeb !== 'undefined' && typeof CustomerWeb.init === 'function') {
      CustomerWeb.init();
    } else if (typeof UIWeb !== 'undefined' && typeof UIWeb.init === 'function') {
      UIWeb.init();
    }
    if (typeof AppRouter !== 'undefined' && typeof AppRouter.init === 'function') {
      AppRouter.init();
    }
    if (_searchParams.get('openMenu') === '1') {
      setTimeout(() => {
        const btn = document.getElementById('headerUserBtn');
        if (btn) btn.click();
        else if (typeof CustomerWeb !== 'undefined') CustomerWeb.toggleUserMenu();
      }, 350);
    }
    if (_searchParams.get('openAuth') === '1') {
      setTimeout(() => {
        if (typeof UICommon !== 'undefined') UICommon.openAuthModal(_searchParams.get('authTab') || 'login');
      }, 350);
    }
    if (_searchParams.get('openCart') === '1') {
      setTimeout(() => {
        if (typeof AppRouter !== 'undefined') AppRouter.navigate('/cart');
        else if (typeof UICommon !== 'undefined') UICommon.goToCartPage();
      }, 600);
    }
    if (_searchParams.get('category') && typeof ServicesPage !== 'undefined') {
      setTimeout(() => ServicesPage.setCategory(_searchParams.get('category')), 250);
    }
    if (_searchParams.get('adminTab') && typeof AdminWeb !== 'undefined') {
      setTimeout(() => {
        if (typeof AdminWeb.switchSubTab === 'function') AdminWeb.switchSubTab(_searchParams.get('adminTab'));
      }, 300);
    }
  </script>
