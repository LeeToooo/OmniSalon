<!DOCTYPE html>
<html lang="vi" data-theme="light">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Omni Salon — Nghệ Thuật Chăm Sóc & Tạo Kiểu Tóc Hiện Đại</title>

  <!-- SEO & Social Meta Tags -->
  <meta name="description"
    content="Omni Salon - Nghệ thuật Chăm sóc & Tạo kiểu tóc hiện đại. Đặt lịch trải nghiệm salon 5 sao, styling cao cấp, uốn phục hồi, mỹ phẩm tóc chính hãng và công nghệ tạo kiểu tóc thông minh AI.">
  <meta name="theme-color" content="#f1f3f6">
  <link rel="manifest" href="manifest.json">
  <link rel="icon"
    href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='22' fill='%23b48312'/><text x='50%' y='58%' dominant-baseline='middle' text-anchor='middle' fill='%23ffffff' font-family='sans-serif' font-weight='900' font-size='32'>OS</text></svg>">

  <!-- Modern Inter & Plus Jakarta Sans Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&family=Plus+Jakarta+Sans:wght@400;500;600;700;800;900&display=swap"
    rel="stylesheet">

  <link rel="stylesheet" href="styles.css?v=20.0">

  <!-- Centralized Theme Engine (Zero FOUC) -->
  <script src="js/core/theme.js?v=1.0"></script>
</head>

<body data-theme="light">


  <!-- ========================================================
       2. NỀN TẢNG BẢN WEB (DESKTOP & RESPONSIVE PORTAL)
       ======================================================== -->
  <div id="webPlatformSection" style="min-height: 100vh;">
    <div id="webHeaderContainer"></div>
    <main id="webMainContainer" style="min-height: calc(100vh - 120px);"></main>
  </div>

  <!-- ========================================================
       3. GLOBAL MODAL DIALOG (BOOKING WIZARD, AI PHOTO RESTYLE, AUTH)
       ======================================================== -->
  <div class="modal-overlay" id="globalModal">
    <div class="modal-content-shell">
      <button class="modal-close-icon-btn" onclick="UICommon.closeGlobalModal()" title="Đóng">✕</button>
      <div id="globalModalBody"></div>
    </div>
  </div>

  <!-- ========================================================
       4. SHOPPING CART DRAWER (GIỎ HÀNG)
       ======================================================== -->
  <div class="cart-drawer-shell" id="cartDrawer">
    <div class="cart-drawer-header">
      <h3 style="font-size: 16px; font-weight: 800; text-transform: uppercase;">Giỏ Hàng Của Bạn</h3>
      <button class="modal-close-icon-btn" onclick="UICommon.closeCartDrawer()" title="Đóng">✕</button>
    </div>
    <div class="cart-drawer-list" id="cartItemsList"></div>
    <div class="cart-drawer-footer">
      <div style="display: flex; justify-content: space-between; align-items: baseline; margin-bottom: 12px;">
        <span style="font-size: 13px; font-weight: 600; color: var(--text-secondary);">Tổng thanh toán:</span>
        <span id="cartTotalAmount" style="font-size: 18px; font-weight: 900; color: var(--color-terracotta);">0 đ</span>
      </div>
      <button class="btn-submit-terracotta" style="width: 100%;" onclick="UICommon.checkoutCart()">
        Thanh Toán Đơn Hàng →
      </button>
    </div>
  </div>

  <!-- ========================================================
       5. HỆ THỐNG TOAST NOTIFICATIONS
       ======================================================== -->
  <div class="toast-container" id="toastContainer"></div>

  <!-- ========================================================
       6. THANH ĐIỀU HƯỚNG DƯỚI ĐÁY CHO DI ĐỘNG (MOBILE BOTTOM NAV)
       Tích hợp Web PC và Web Mobile làm 1 bản Responsive duy nhất
       ======================================================== -->
  <nav class="mobile-bottom-nav" aria-label="Thanh điều hướng Web Mobile">
    <a href="/" data-route="/" onclick="event.preventDefault(); CustomerWeb.switchTab('home')" class="active" id="mNavHome">
      <span class="nav-icon">🏠</span>
      <span>Trang Chủ</span>
    </a>
    <a href="/services" data-route="/services" onclick="event.preventDefault(); CustomerWeb.switchTab('services')" id="mNavServices">
      <span class="nav-icon">✂️</span>
      <span>Dịch Vụ</span>
    </a>
    <a href="/stylists" data-route="/stylists" onclick="event.preventDefault(); CustomerWeb.switchTab('stylists')" id="mNavStylists">
      <span class="nav-icon">💈</span>
      <span>Thợ Mẫu</span>
    </a>
    <a href="/booking" data-route="/booking" onclick="event.preventDefault(); CustomerWeb.switchTab('booking')" style="color: #b48312; font-weight: 800;" id="mNavBooking">
      <span class="nav-icon">📅</span>
      <span>Đặt Lịch</span>
    </a>
    <a href="/shop" data-route="/shop" onclick="event.preventDefault(); CustomerWeb.switchTab('shop')" id="mNavShop">
      <span class="nav-icon">🛍️</span>
      <span>Cửa Hàng</span>
    </a>
    <a href="/branches" data-route="/branches" onclick="event.preventDefault(); CustomerWeb.switchTab('branches')" id="mNavBranches">
      <span class="nav-icon">📍</span>
      <span>Chi Nhánh</span>
    </a>
  </nav>


  <!-- ========================================================
       CẤU TRÚC MODULES KIẾN TRÚC PHÂN LỚP (LAYERED ARCHITECTURE):
       2. js/core/utils.js        -> Tiện ích định dạng, Platform Manager
       3. js/core/pricing.js      -> Công cụ tính giá & phụ phí
       4. js/core/auth.js         -> Tầng xác thực & Phân quyền bảo mật JWT RBAC
       5. js/core/store.js        -> Reactive State Engine, Đặt lịch, Giỏ hàng, POS
       6. js/core/api.js          -> Tầng API REST & AI Vision Service
       7. js/components/ui-common.js -> UI chung (Product cards, Booking wizard, Cart)
       8. js/modules/customer/web/customer-web.js -> Phân hệ Khách hàng trên Web Portal
       9. js/web/ui-web.js        -> Giao diện Web Portal & Trung tâm Quản trị Admin
       ======================================================== -->
  <script src="js/core/utils.js?v=50.0"></script>
  <script src="js/core/pricing.js?v=50.0"></script>
  <script src="js/core/auth.js?v=50.0"></script>
  <script src="js/core/store.js?v=50.0"></script>
  <script src="js/core/api.js?v=50.0"></script>
  <script src="js/widgets/widgets-bundle.js?v=50.0"></script>
  <script src="js/components/ui-common.js?v=50.0"></script>
  <script src="js/modules/customer/web/customer-web.js?v=50.0"></script>
  <script src="js/modules/admin/web/admin-web.js?v=50.0"></script>
  <script src="js/web/ui-web.js?v=50.0"></script>

  <!-- Modular Page Components (Multi-Page Architecture) -->
  <script src="pages/home-page.js?v=50.0"></script>
  <script src="pages/services-page.js?v=50.0"></script>
  <script src="pages/stylists-page.js?v=50.0"></script>
  <script src="pages/booking-page.js?v=50.0"></script>
  <script src="pages/shop-page.js?v=50.0"></script>
  <script src="pages/branches-page.js?v=50.0"></script>
  <script src="pages/ai-studio-page.js?v=50.0"></script>
  <script src="pages/admin-portal.js?v=50.0"></script>

  <!-- 3D Perspective Client Router -->
  <script src="js/core/router.js?v=25.0"></script>

  <!-- Khởi động giao diện Web Portal & 3D Multi-Page Router -->
  <script>
    // Hỗ trợ tham số URL trực quan: ?openMenu=1&openAuth=1&openCart=1&theme=dark|light&category=cat
    const _searchParams = new URLSearchParams(window.location.search);
    if (_searchParams.get('theme') && typeof ThemeEngine !== 'undefined') {
      ThemeEngine.setTheme(_searchParams.get('theme'));
    }
    if (_searchParams.get('loginAs') && typeof AuthEngine !== 'undefined') {
      const roleOrUser = _searchParams.get('loginAs');
      const seed = AuthEngine.getSeedAccounts().find(u => u.username === roleOrUser || u.role === roleOrUser);
      if (seed) {
        AuthEngine.login(seed.username, seed.password);
        if (['SUPER_ADMIN', 'ADMIN', 'BRANCH_MANAGER'].includes(seed.role) || seed.username === 'admin') {
          if (typeof CustomerWeb !== 'undefined') {
            CustomerWeb.currentTab = 'admin';
          }
          setTimeout(() => {
            if (typeof AppRouter !== 'undefined' && !_searchParams.get('route')) {
              AppRouter.navigate('/admin');
            }
          }, 60);
        }
      }
    }

    if (typeof CustomerWeb !== 'undefined' && typeof CustomerWeb.init === 'function') {
      CustomerWeb.init();
    } else if (typeof UIWeb !== 'undefined' && typeof UIWeb.init === 'function') {
      UIWeb.init();
    }
    if (typeof AppRouter !== 'undefined' && typeof AppRouter.init === 'function') {
      AppRouter.init();
    }
    if (_searchParams.get('openMenu') === '1') {
      setTimeout(() => {
        const btn = document.getElementById('headerUserBtn');
        if (btn) btn.click();
        else if (typeof CustomerWeb !== 'undefined') CustomerWeb.toggleUserMenu();
      }, 350);
    }
    if (_searchParams.get('openAuth') === '1') {
      setTimeout(() => {
        if (typeof UICommon !== 'undefined') UICommon.openAuthModal(_searchParams.get('authTab') || 'login');
      }, 350);
    }
    if (_searchParams.get('openCart') === '1') {
      setTimeout(() => {
        if (typeof UICommon !== 'undefined') UICommon.openCartDrawer();
      }, 350);
    }
    if (_searchParams.get('category') && typeof ServicesPage !== 'undefined') {
      setTimeout(() => ServicesPage.setCategory(_searchParams.get('category')), 250);
    }
    if (_searchParams.get('adminTab') && typeof AdminWeb !== 'undefined') {
      setTimeout(() => {
        if (typeof AdminWeb.switchSubTab === 'function') AdminWeb.switchSubTab(_searchParams.get('adminTab'));
      }, 300);
    }
  </script>
</body>

</html>
