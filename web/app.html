<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>Omni Salon Mobile App — The Art of Modern Hair Care & Grooming</title>
  
  <!-- SEO & Mobile Web App Meta -->
  <meta name="description" content="Ứng dụng di động chính thức của hệ thống Omni Salon — The Art of Modern Hair Care & Grooming. Đặt lịch trải nghiệm, Stylist 5 sao, AI Studio.">
  <meta name="theme-color" content="#f1f3f6">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <link rel="manifest" href="manifest.json">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='22' fill='%230B0D13'/><text x='50%' y='58%' dominant-baseline='middle' text-anchor='middle' fill='%23D4AF37' font-family='sans-serif' font-weight='900' font-size='32'>OS</text></svg>">

  <!-- Modern Inter & Plus Jakarta Sans Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&family=Plus+Jakarta+Sans:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="styles.css?v=20.0">

  <!-- TỰ ĐỘNG CHUYỂN HƯỚNG VỀ BẢN WEB ĐÃ TÍCH HỢP RESPONSIVE (YÊU CẦU THỨ 5) -->
  <script>
    // Tự động chuyển hướng về bản Web thống nhất Responsive
    window.location.replace('index.html' + window.location.search + window.location.hash);
  </script>
</head>
<body class="mobile-app-body" style="background: var(--bg-primary, #f1f3f6); color: var(--text-primary, #0f172a); text-align: center; padding: 40px 20px;">

  <!-- THÔNG BÁO TÍCH HỢP HỆ THỐNG -->
  <div style="max-width: 500px; margin: 40px auto; background: var(--surface-card, #ffffff); padding: 32px; border-radius: 16px; border: 1px solid var(--border-color, #cbd5e1); box-shadow: 0 4px 16px rgba(0,0,0,0.06);">
    <h2 style="color: var(--text-primary, #0f172a); font-weight: 900; margin-bottom: 12px;">Omni Salon — Bản Web Hợp Nhất</h2>
    <p style="color: var(--text-secondary, #475569); font-size: 15px; line-height: 1.6; margin-bottom: 24px;">
      Hệ thống đã tích hợp toàn bộ bản Web PC và Web Mobile thành một giao diện Responsive duy nhất. Đang chuyển hướng bạn đến trang chính...
    </p>
    <a href="index.html" style="display: inline-block; background: var(--brand-accent, #b48312); color: #ffffff; font-weight: 700; padding: 12px 24px; border-radius: 10px; text-decoration: none;">
      Truy Cập Ngay →
    </a>
  </div>


  <!-- NỀN TẢNG MOBILE NATIVE (TỰ ĐỘNG FULL MÀN HÌNH KHI MỞ TRÊN ĐIỆN THOẠI HOẶC APP APK) -->
  <div id="appMobileContainer" class="mobile-app-standalone-container"></div>

  <!-- GLOBAL MODAL DIALOG (BOOKING, AI STUDIO, AUTH) -->
  <div class="modal-overlay" id="globalModal">
    <div class="modal-content-shell">
      <button class="modal-close-icon-btn" onclick="UICommon.closeGlobalModal()" title="Đóng">✕</button>
      <div id="globalModalBody"></div>
    </div>
  </div>

  <!-- SHOPPING CART DRAWER / BOTTOM SHEET -->
  <div class="cart-drawer-shell" id="cartDrawer">
    <div class="cart-drawer-header">
      <h3 style="font-size: 20px; font-weight: 800; text-transform: uppercase; color: #FFFFFF;">Giỏ Hàng Của Bạn</h3>
      <button class="modal-close-icon-btn" onclick="UICommon.closeCartDrawer()" title="Đóng">✕</button>
    </div>
    <div class="cart-drawer-list" id="cartItemsList"></div>
    <div class="cart-drawer-footer">
      <div style="display: flex; justify-content: space-between; align-items: baseline; margin-bottom: 12px;">
        <span style="font-size: 15px; font-weight: 700; color: #CBD5E1;">Tổng thanh toán:</span>
        <span id="cartTotalAmount" style="font-size: 22px; font-weight: 900; color: var(--color-terracotta);">0 đ</span>
      </div>
      <button class="btn-submit-terracotta" style="width: 100%; min-height: 50px; font-size: 16px; font-weight: 800;" onclick="UICommon.checkoutCart()">
        Thanh Toán Đơn Hàng →
      </button>
    </div>
  </div>

  <!-- TOAST NOTIFICATIONS -->
  <div class="toast-container" id="toastContainer"></div>

  <!-- ========================================================
       CẤU TRÚC MODULES KIẾN TRÚC PHÂN LỚP (LAYERED ARCHITECTURE):
       2. js/core/utils.js        -> Tiện ích định dạng, Platform Manager
       3. js/core/store.js        -> Reactive State Engine, Đặt lịch, Giỏ hàng, POS
       4. js/core/api.js          -> Tầng API REST & AI Vision Service
       5. js/components/ui-common.js -> UI chung (Product cards, Booking wizard, Cart)
       6. js/app/ui-app.js        -> Giao diện Mobile App (5 Tabs, AI Studio, Profile)
       ======================================================== -->
  <script src="js/core/utils.js?v=12.0"></script>
  <script src="js/core/pricing.js?v=12.0"></script>
  <script src="js/core/auth.js?v=12.0"></script>
  <script src="js/core/store.js?v=12.0"></script>
  <script src="js/core/api.js?v=12.0"></script>
  <script src="js/app/app-state.js?v=12.0"></script>
  <script src="js/widgets/service-card-widget.js?v=12.0"></script>
  <script src="js/widgets/stylist-card-widget.js?v=12.0"></script>
  <script src="js/widgets/time-slot-chips-widget.js?v=12.0"></script>
  <script src="js/widgets/booking-slot-picker.js?v=12.0"></script>
  <script src="js/widgets/stat-card-widget.js?v=12.0"></script>
  <script src="js/widgets/shimmer-loading-widget.js?v=12.0"></script>
  <script src="js/widgets/widgets-bundle.js?v=12.0"></script>
  <script src="js/components/ui-common.js?v=11.0"></script>
  <script src="js/modules/customer/app/customer-app.js?v=11.0"></script>
  <script src="js/modules/admin/app/admin-app.js?v=11.0"></script>
  <script src="js/app/ui-app.js?v=11.0"></script>

  <!-- Khởi chạy trực tiếp bản Mobile App -->
  <script>
    document.addEventListener('DOMContentLoaded', () => {
      UIApp.init();
    });
  </script>
</body>
</html>
