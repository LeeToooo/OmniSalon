<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Omni Salon — Chuyển Hướng Hệ Thống</title>
  <meta http-equiv="refresh" content="0; url=web/index.html">
  <script>
    window.location.replace("web/index.html");
  </script>
  <style>
    body {
      margin: 0;
      padding: 0;
      background-color: #f1f3f6;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      color: #0f172a;
    }
    .redirect-card {
      background: #ffffff;
      padding: 32px 40px;
      border-radius: 16px;
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.05);
      border: 1px solid #e2e8f0;
      text-align: center;
    }
    .spinner {
      width: 32px;
      height: 32px;
      border: 3px solid #e2e8f0;
      border-top-color: #d97706;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
      margin: 0 auto 16px;
    }
    @keyframes spin {
      to { transform: rotate(360deg); }
    }
    a {
      color: #b45309;
      font-weight: 600;
      text-decoration: none;
    }
  </style>
</head>
<body>
  <div class="redirect-card">
    <div class="spinner"></div>
    <h2 style="margin: 0 0 8px; font-size: 20px;">Đang mở Omni Salon...</h2>
    <p style="margin: 0; font-size: 14px; color: #64748b;">
      Nếu trình duyệt không tự chuyển, vui lòng <a href="web/index.html">nhấn vào đây</a>.
    </p>
  </div>
</body>
</html>
