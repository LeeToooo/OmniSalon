<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>4RAU Barbershop Mobile App — Đặt Lịch & AI Đổi Kiểu Tóc</title>
  
  <!-- SEO & Mobile Web App Meta -->
  <meta name="description" content="Ứng dụng di động chính thức của chuỗi 4RAU Barbershop. Đặt lịch cắt tóc theo chi nhánh, thử kiểu tóc AI bằng ảnh thật, mua sáp vuốt tóc chính hãng.">
  <meta name="theme-color" content="#121214">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <link rel="manifest" href="manifest.json">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='20' fill='%23c85a44'/><text x='50%' y='58%' dominant-baseline='middle' text-anchor='middle' fill='%23ffffff' font-family='sans-serif' font-weight='900' font-size='32'>4R</text></svg>">

  <!-- Modern Inter Google Font -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">

  <!-- Master Stylesheet -->
  <link rel="stylesheet" href="styles.css?v=11.0">
</head>
<body class="mobile-app-body">

  <!-- THANH BÁO XEM THỬ MOBILE TRÊN MÁY TÍNH (ẨN TRÊN ĐIỆN THOẠI) -->
  <div class="app-desktop-preview-bar">
    <span>📱 <strong>4RAU Mobile App</strong> (Bản xem trước di động)</span>
    <a href="index.html">🌐 Mở Bản Web Desktop →</a>
  </div>

  <!-- NỀN TẢNG MOBILE NATIVE (TỰ ĐỘNG FULL MÀN HÌNH KHI MỞ TRÊN ĐIỆN THOẠI HOẶC APP APK) -->
  <div id="appMobileContainer" class="mobile-app-standalone-container"></div>

  <!-- GLOBAL MODAL DIALOG (BOOKING, AI STUDIO, AUTH) -->
  <div class="modal-overlay" id="globalModal">
    <div class="modal-content-shell">
      <button class="modal-close-icon-btn" onclick="UICommon.closeGlobalModal()" title="Đóng">✕</button>
      <div id="globalModalBody"></div>
    </div>
  </div>

  <!-- SHOPPING CART DRAWER / BOTTOM SHEET -->
  <div class="cart-drawer-shell" id="cartDrawer">
    <div class="cart-drawer-header">
      <h3 style="font-size: 16px; font-weight: 800; text-transform: uppercase;">Giỏ Hàng Của Bạn</h3>
      <button class="modal-close-icon-btn" onclick="UICommon.closeCartDrawer()" title="Đóng">✕</button>
    </div>
    <div class="cart-drawer-list" id="cartItemsList"></div>
    <div class="cart-drawer-footer">
      <div style="display: flex; justify-content: space-between; align-items: baseline; margin-bottom: 12px;">
        <span style="font-size: 13px; font-weight: 600; color: #555;">Tổng thanh toán:</span>
        <span id="cartTotalAmount" style="font-size: 18px; font-weight: 900; color: var(--color-terracotta);">0 đ</span>
      </div>
      <button class="btn-submit-terracotta" style="width: 100%;" onclick="UICommon.checkoutCart()">
        Thanh Toán Đơn Hàng →
      </button>
    </div>
  </div>

  <!-- TOAST NOTIFICATIONS -->
  <div class="toast-container" id="toastContainer"></div>

  <!-- ========================================================
       CẤU TRÚC MODULES KIẾN TRÚC PHÂN LỚP (LAYERED ARCHITECTURE):
       1. js/core/data.js         -> Dữ liệu hạt giống (18+ Chi nhánh, dịch vụ, sản phẩm)
       2. js/core/utils.js        -> Tiện ích định dạng, Platform Manager
       3. js/core/store.js        -> Reactive State Engine, Đặt lịch, Giỏ hàng, POS
       4. js/core/api.js          -> Tầng API REST & AI Vision Service
       5. js/components/ui-common.js -> UI chung (Product cards, Booking wizard, Cart)
       6. js/app/ui-app.js        -> Giao diện Mobile App (5 Tabs, AI Studio, Profile)
       ======================================================== -->
  <script src="js/core/data.js?v=11.0"></script>
  <script src="js/core/utils.js?v=11.0"></script>
  <script src="js/core/store.js?v=11.0"></script>
  <script src="js/core/api.js?v=11.0"></script>
  <script src="js/components/ui-common.js?v=11.0"></script>
  <script src="js/app/ui-app.js?v=11.0"></script>

  <!-- Khởi chạy trực tiếp bản Mobile App -->
  <script>
    document.addEventListener('DOMContentLoaded', () => {
      UIApp.init();
    });
  </script>
</body>
</html>
